name: bing_chun_delivery
description: Bing Chun delivery staff app — optimized delivery routes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  # Wired M8 pieces (GPS + realtime). FCM / Google Maps / foreground
  # service / Hive offline queue are deferred until disk + native config
  # (google-services.json) are ready — they were declared but unused.
  socket_io_client: ^3.1.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#05C1FF"
  adaptive_icon_background: "#05C1FF"
  adaptive_icon_foreground: assets/brand/app_icon.png

flutter_native_splash:
  color: "#05C1FF"
  image: assets/brand/app_icon.png
  android: true
  ios: true
  android_12:
    color: "#05C1FF"
    image: assets/brand/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
