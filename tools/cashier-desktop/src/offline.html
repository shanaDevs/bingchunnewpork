<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Offline — Bing Chun Cashier</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e293b 55%, #7f1d1d);
      color: #f8fafc;
      text-align: center;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 20px; color: #cbd5e1; max-width: 36rem; line-height: 1.5; }
    code {
      display: inline-block;
      margin-top: 4px;
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.55);
      border-radius: 6px;
      font-size: 0.85rem;
      word-break: break-all;
    }
    button {
      border: 0;
      background: #c41e3a;
      color: #fff;
      font-weight: 650;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div>
    <h1>Cannot reach POS</h1>
    <p>Check the branch internet connection, then retry. You can also change the POS URL in Settings (Cashier → Settings).</p>
    <code id="url"></code>
    <p style="margin-top:20px">
      <button type="button" id="retry">Retry</button>
    </p>
  </div>
  <script src="./offline.js"></script>
</body>
</html>
