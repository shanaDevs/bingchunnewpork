name: bing_chun_customer
description: Bing Chun customer app - menu browsing, ordering, and real-time delivery tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  audioplayers: ^6.8.0
  webview_flutter: ^4.13.1
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.5
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^18.0.1
  socket_io_client: ^3.1.2
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  sms_autofill: ^2.4.1
  shared_preferences: ^2.5.5
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/mascots/
    - assets/promos/
    - assets/orders/
    - assets/sounds/
