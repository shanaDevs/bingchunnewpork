# Optional GHCR path. The live apps build from GitHub (deploy on push to main).
# This workflow only retags existing container images. It refuses to update an
# app that has no image, so it cannot replace a GitHub-built app.
# See deploy/digitalocean/README.md.

name: CI/CD (DigitalOcean)

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: digitalocean-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bing-chun-migrate
            file: backend/Dockerfile.migrate
            build_args: ""
          - image: bing-chun-shop
            file: backend/Dockerfile
            build_args: API_SURFACE=shop
          - image: bing-chun-pos
            file: backend/Dockerfile
            build_args: API_SURFACE=pos
          - image: bing-chun-admin
            file: backend/Dockerfile
            build_args: API_SURFACE=admin
          - image: bing-chun
            file: Frontend/deploy/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=/api
              WEB_SURFACE=shop
          - image: bing-chun-pos-web
            file: Frontend/deploy/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=/api
              WEB_SURFACE=pos
          - image: bing-chun-admin-web
            file: Frontend/deploy/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=/api
              WEB_SURFACE=admin
          - image: bing-chun-delivery
            file: delivery-service/Dockerfile
            build_args: ""
          - image: bing-chun-delivery-frontend
            file: delivery-frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=/api

    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${owner}/${repo}/${{ matrix.image }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${{ github.sha }}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy DigitalOcean apps
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require DigitalOcean secrets
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID_SHOP: ${{ secrets.DO_APP_ID_SHOP }}
          DO_APP_ID_POS: ${{ secrets.DO_APP_ID_POS }}
          DO_APP_ID_ADMIN: ${{ secrets.DO_APP_ID_ADMIN }}
          DO_APP_ID_DELIVERY: ${{ secrets.DO_APP_ID_DELIVERY }}
        run: |
          missing=0
          for name in DIGITALOCEAN_ACCESS_TOKEN DO_APP_ID_SHOP DO_APP_ID_POS DO_APP_ID_ADMIN DO_APP_ID_DELIVERY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create the four apps first, then add these secrets. See deploy/digitalocean/README.md"
            exit 1
          fi

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Deploy shop, then the other apps
        env:
          DO_APP_ID_SHOP: ${{ secrets.DO_APP_ID_SHOP }}
          DO_APP_ID_POS: ${{ secrets.DO_APP_ID_POS }}
          DO_APP_ID_ADMIN: ${{ secrets.DO_APP_ID_ADMIN }}
          DO_APP_ID_DELIVERY: ${{ secrets.DO_APP_ID_DELIVERY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_one() {
            local app_id="$1"
            local spec_file="$2"
            echo "Updating app ${app_id}"
            doctl apps spec get "$app_id" > "$spec_file"
            python .github/scripts/do_set_image_tags.py "$spec_file" "$IMAGE_TAG"
            doctl apps update "$app_id" --spec "$spec_file" --wait
          }
          deploy_one "$DO_APP_ID_SHOP" shop.spec.yaml
          deploy_one "$DO_APP_ID_POS" pos.spec.yaml
          deploy_one "$DO_APP_ID_ADMIN" admin.spec.yaml
          deploy_one "$DO_APP_ID_DELIVERY" delivery.spec.yaml
