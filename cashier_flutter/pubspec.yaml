name: bing_chun_cashier
description: "Bing Chun cashier  app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  audioplayers: ^6.7.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.2
  cookie_jar: ^4.0.9
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  intl: ^0.20.2
  latlong2: ^0.10.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Launcher icons from the brand mascot (assets/images/logo.png → assets/icon/*).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  remove_alpha_ios: true

# Native launch screen (shown while Flutter starts) — cashier sidebar indigo + mascot.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1A1953"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#1A1953"
    image: assets/icon/splash_android12.png
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  # Poppins — the web admin/cashier font (SIL Open Font License, see assets/fonts/OFL.txt).
  # Latin only; Chinese falls back to the system font automatically.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
