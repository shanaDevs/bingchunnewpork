# Generated app spec. Secrets in git stay REPLACE_ME.
# Live apps get the generated values from the gitignored secrets file.
# Postgres and Valkey are the existing Singapore clusters, direct port via the binding.
# A push to main deploys this app. Do not enable autoscaling.
name: bingchun-admin
region: sgp
vpc:
  id: e9844e32-e978-4544-a8c7-0bed9c9ab21c
disable_edge_cache: true
alerts:
  - rule: DEPLOYMENT_FAILED
databases:
  - name: pg
    engine: PG
    version: "16"
    production: true
    cluster_name: bingchun-pg
    db_name: defaultdb
    db_user: doadmin
  - name: cache
    engine: VALKEY
    version: "8"
    production: true
    cluster_name: bingchun-valkey
ingress:
  rules:
    # API + health hit admin-api directly (delivery ops + admin-web avoid Next double-proxy).
    - match:
        path:
          prefix: /socket.io
      component:
        name: admin-api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /api
      component:
        name: admin-api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: admin-api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: admin-web
        preserve_path_prefix: true
services:
  - name: admin-api
    github:
      repo: Bing-Chung-Dart/bingchun
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    http_port: 4000
    health_check:
      http_path: /health
      initial_delay_seconds: 40
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: TZ
        scope: RUN_TIME
        value: Asia/Colombo
      - key: API_SURFACE
        scope: RUN_AND_BUILD_TIME
        value: admin
      - key: RUN_BACKGROUND_JOBS
        scope: RUN_TIME
        value: "false"
      # Delivery console calls this API cross-origin.
      - key: ADMIN_COOKIE_SAMESITE
        scope: RUN_TIME
        value: "none"
      - key: PRISMA_CONNECTION_LIMIT
        scope: RUN_TIME
        value: "4"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: "${pg.DATABASE_URL}"
      - key: REDIS_URL
        scope: RUN_TIME
        value: "${cache.DATABASE_URL}"
      - key: JWT_SECRET
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: JWT_REFRESH_SECRET
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: INTERNAL_SERVICE_SECRET
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: DELIVERY_OTP_PEPPER
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: DRIVER_PIN_PEPPER
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: GOOGLE_MAPS_API_KEY
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: GOOGLE_MAPS_SERVER_API_KEY
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: "https://bing-chun-ui2ow.ondigitalocean.app"
      - key: ADMIN_WEB_URL
        scope: RUN_TIME
        value: "https://admin.bingchunsrilanka.com"
      - key: POS_WEB_URL
        scope: RUN_TIME
        value: "https://bingchun-pos-i8pq3.ondigitalocean.app"
      - key: CORS_EXTRA_ORIGINS
        scope: RUN_TIME
        value: "https://admin.bingchunsrilanka.com,https://delivery.bingchunsrilanka.com,https://bingchunsrilanka.com,https://bingchun-admin-a4ndy.ondigitalocean.app,https://bingchun-delivery-6mgs2.ondigitalocean.app,https://bingchun-pos-i8pq3.ondigitalocean.app,https://bing-chun-ui2ow.ondigitalocean.app"
  - name: admin-web
    github:
      repo: Bing-Chung-Dart/bingchun
      branch: main
      deploy_on_push: true
    dockerfile_path: Frontend/deploy/Dockerfile
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1
    http_port: 80
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: WEB_SURFACE
        scope: RUN_AND_BUILD_TIME
        value: admin
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: /api
      # Same-origin sockets via ingress /socket.io → admin-api (never the starter host — it 302s).
      - key: NEXT_PUBLIC_SOCKET_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://admin.bingchunsrilanka.com"
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://admin.bingchunsrilanka.com"
      - key: ADMIN_WEB_URL
        scope: RUN_TIME
        value: "https://admin.bingchunsrilanka.com"
      - key: BACKEND_URL
        scope: RUN_TIME
        value: "${admin-api.PRIVATE_URL}"
      - key: ADMIN_API_URL
        scope: RUN_TIME
        value: "${admin-api.PRIVATE_URL}"
      - key: API_PROXY_URL
        scope: RUN_TIME
        value: "${admin-api.PRIVATE_URL}"
