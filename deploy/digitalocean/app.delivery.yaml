# Generated app spec. Secrets in git stay REPLACE_ME.
# Live apps get the generated values from the gitignored secrets file.
# Postgres and Valkey are the existing Singapore clusters, direct port via the binding.
# A push to main deploys this app. Do not enable autoscaling.
name: bingchun-delivery
region: sgp
vpc:
  id: e9844e32-e978-4544-a8c7-0bed9c9ab21c
disable_edge_cache: true
alerts:
  - rule: DEPLOYMENT_FAILED
databases:
  - name: pg
    engine: PG
    version: "16"
    production: true
    cluster_name: bingchun-pg
    db_name: defaultdb
    db_user: doadmin
  - name: cache
    engine: VALKEY
    version: "8"
    production: true
    cluster_name: bingchun-valkey
ingress:
  rules:
    # Admin HTTP APIs for delivery-service (when not via shop /api).
    - match:
        path:
          prefix: /delivery-api
      component:
        name: delivery
        preserve_path_prefix: true
    # Socket.IO must hit delivery-web so Next can rewrite to shop BACKEND_URL.
    - match:
        path:
          prefix: /socket.io
      component:
        name: delivery-web
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: delivery-web
        preserve_path_prefix: true
services:
  - name: delivery
    github:
      repo: Bing-Chung-Dart/bingchun
      branch: main
      deploy_on_push: true
    dockerfile_path: delivery-service/Dockerfile
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1
    http_port: 4100
    health_check:
      http_path: /health
      initial_delay_seconds: 40
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: TZ
        scope: RUN_TIME
        value: Asia/Colombo
      - key: PRISMA_CONNECTION_LIMIT
        scope: RUN_TIME
        value: "4"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: "${pg.DATABASE_URL}"
      - key: REDIS_URL
        scope: RUN_TIME
        value: "${cache.DATABASE_URL}"
      - key: JWT_SECRET
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: JWT_REFRESH_SECRET
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: INTERNAL_SERVICE_SECRET
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: DELIVERY_OTP_PEPPER
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: DRIVER_PIN_PEPPER
        scope: RUN_TIME
        value: REPLACE_ME
        type: SECRET
      - key: GOOGLE_MAPS_API_KEY
        value: REPLACE_ME
        type: SECRET
      - key: DELIVERY_FRONTEND_URL
        scope: RUN_TIME
        value: "https://delivery.bingchunsrilanka.com"
      - key: CORS_EXTRA_ORIGINS
        scope: RUN_TIME
        value: "https://delivery.bingchunsrilanka.com,https://admin.bingchunsrilanka.com,https://bingchun-delivery-6mgs2.ondigitalocean.app,https://bingchun-admin-a4ndy.ondigitalocean.app"
  - name: delivery-web
    github:
      repo: Bing-Chung-Dart/bingchun
      branch: main
      deploy_on_push: true
    dockerfile_path: delivery-frontend/Dockerfile
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    http_port: 3100
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # Same-origin /api so the session cookie is first-party. delivery-web proxies to BACKEND_URL.
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: "/api"
      - key: DELIVERY_SERVICE_URL
        scope: RUN_TIME
        value: "${delivery.PRIVATE_URL}"
      # Custom admin domain — starter host 302s and breaks POST login + Socket.IO.
      - key: BACKEND_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://admin.bingchunsrilanka.com"
      - key: API_PROXY_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://admin.bingchunsrilanka.com"
      - key: NEXT_PUBLIC_SOCKET_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://admin.bingchunsrilanka.com"
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://delivery.bingchunsrilanka.com"
      - key: NEXT_PUBLIC_DELIVERY_ADMIN_VIA_CORE
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: DELIVERY_ADMIN_VIA_CORE
        scope: RUN_TIME
        value: "true"
      - key: MAIN_ADMIN_URL
        scope: RUN_TIME
        value: "https://admin.bingchunsrilanka.com/admin"
      - key: ADMIN_WEB_URL
        scope: RUN_TIME
        value: "https://admin.bingchunsrilanka.com"
      - key: NEXT_PUBLIC_MAIN_ADMIN_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://admin.bingchunsrilanka.com/admin"
