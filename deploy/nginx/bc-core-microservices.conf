# CapRover -> Apps -> bing-chun-core -> HTTP Settings -> Edit Default Nginx Config.
# Paste these `location` blocks BEFORE the existing default `location /` block
# that proxies to the bing-chun-core container itself. CapRover's Docker overlay
# network resolves other apps at http://srv-captain--<app-name>:<port>.
#
# Only add a block once that service's controllers have actually been moved
# out of bing-chun-core (see services/*/src/routes/index.ts TODOs) and the matching
# *_SERVICE_ENABLED flag is flipped on bing-chun-core. Until then, leave the path
# unrouted here so bing-chun-core keeps serving it directly.

# ---- order-service ----
location /api/orders/ {
    proxy_pass http://srv-captain--bing-chun-orders:4200/order-api/orders/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/inventory/ {
    proxy_pass http://srv-captain--bing-chun-orders:4200/order-api/inventory/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/refunds/ {
    proxy_pass http://srv-captain--bing-chun-orders:4200/order-api/refunds/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- payment-service ----
# PayHere/WebXPay webhooks (server-to-server callbacks) go straight here too —
# no browser Origin header, so CORS on bing-chun-payments does not need to allow them.
location /api/payments/ {
    proxy_pass http://srv-captain--bing-chun-payments:4300/payment-api/payments/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
}

# ---- notification-service ----
# WhatsApp Cloud API signature verification needs the raw body — do not buffer/rewrite it.
location /api/whatsapp/ {
    proxy_pass http://srv-captain--bing-chun-notify:4400/notification-api/whatsapp/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
}

location /api/telegram/ {
    proxy_pass http://srv-captain--bing-chun-notify:4400/notification-api/telegram/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/notifications/ {
    proxy_pass http://srv-captain--bing-chun-notify:4400/notification-api/notifications/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- delivery-service (already built, phase 3) ----
# Core proxies this in application code today via DELIVERY_SERVICE_ENABLED/DELIVERY_SERVICE_URL,
# so no nginx block is required unless you later want to bypass bing-chun-core entirely. If you do,
# also proxy the `/delivery` Socket.IO namespace with the extra Upgrade/Connection headers below.
location /delivery-socket/ {
    proxy_pass http://srv-captain--bing-chun-delivery:4100/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
