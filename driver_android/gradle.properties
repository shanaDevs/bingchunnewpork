# Tuned for an 8 GB machine. The daemon previously died with a native OOM
# (AvailPageFile 16M) because a 2 GB Gradle daemon + a separate ~1 GB Kotlin
# daemon exceeded the system commit limit.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Single-module build (:app only) — parallel spawns extra workers for no gain.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

# Don't let an idle daemon sit on 2 GB for the default 3 hours.
org.gradle.daemon.idletimeout=900000

# Compile Kotlin inside the Gradle daemon instead of forking a second JVM.
# One 2 GB process fits; two (2 GB + 1 GB + overhead) does not.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
